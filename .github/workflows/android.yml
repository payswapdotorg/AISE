# AISE Android CI (AISE-002) — self-contained gate for the field client.
#
# Runs the Android integration-station verification path:
#   1. wrapper integrity,
#   2. JVM unit tests for :core and :app,
#   3. full Android debug build,
#   4. real API-35 emulator instrumentation (navigation + capture surface).
#
# The Android SDK is provisioned per-job; nothing is cached across machines
# except Gradle dependencies (via setup-gradle).
name: Android CI

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Build & test (apps/android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Android SDK (command-line tools)
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests (:core, :app)
        run: ./gradlew :core:test :app:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

  instrumentation:
    name: Emulator instrumentation (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: android
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo "no" | avdmanager create avd --force --name aise-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run real emulator instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aise-android-instrumentation
          path: apps/android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
