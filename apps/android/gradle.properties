# AISE v2 — Android field client Gradle properties (AISE-002).
# Footprint is tuned for constrained CI/sandbox machines (2 cores, ~4 GB RAM).

org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compile daemon footprint (kept small on purpose).
kotlin.daemon.jvmargs=-Xmx1024m

kotlin.code.style=official

# AndroidX is mandatory; there is no support-library fallback in this project.
android.useAndroidX=true
